services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: local_only_password
      POSTGRES_DB: monitoring
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/postgres.yaml:ro
      - ./config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/green-taxi.yaml:ro
      - ./dashboards:/etc/grafana/dashboards:ro

    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:
